<body>
  <div id="juego"></div>
  <script>
    // Si este index.html quedo viejo en el cache del celular, se recarga con la version nueva.
    (function () {
      var esta = '20261110015204';
      fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : esta; })
        .then(function (nueva) {
          nueva = nueva.trim();
          var p = new URLSearchParams(location.search);
          if (nueva && nueva !== esta && p.get('v') !== nueva) {
            p.set('v', nueva);
            location.replace(location.pathname + '?' + p.toString() + location.hash);
          }
        })
        .catch(function () {});
    })();
  </script>
